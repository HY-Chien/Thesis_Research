### SEER decomposer — LoRA SFT of Llama3-8B-Instruct on MuSiQue + 2Wiki + PopQA gold (12000)
### run:  cd ~/LLaMA-Factory && conda activate thesis
###       llamafactory-cli train .../configs/llama3_8b_decomposer_lora_3ds.yaml

### model
model_name_or_path: /workspace/S113065528/RAG-DDR/models/Llama3-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: musique_decomp,twowiki_decomp,popqa_decomp
template: llama3
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /home/S113065528/Research/main_methodology/checkpoints/llama3-8b-decomposer-musique-2wiki-popqa
logging_steps: 10
save_steps: 300
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
